data_dir: E:\자료\5.투자시뮬\국내선물옵션\틱데이터csv
symbol: KOSPI_F
cache_dir: data/dl_cache
tick_window:
  start: 180
  end: 200
  step: 20
coarse_to_fine:
  enabled: true
  coarse_step: 100
  top_n_regions: 2
  fine_neighborhood: 50
cost_model:
  commission_rate: 3.0e-05
  slippage_mode: fixed_and_volume
  fixed_slippage_tick: 0.05
  tick_value_krw: 250000
  volume_impact_coef: 1.0e-05
validation:
  mode: walk_forward
  train_years: 2
  test_months: 6
  embargo_pct: 0.01
modeling:
  task_type: multiclass
  models_to_run:
  - logistic_regression
  - random_forest
  - xgboost
  - lightgbm
  - patch_tst
  - foundation_ts
  optuna_trials: 15
  deep_learning:
    epochs: 20
    batch_size: 64
    learning_rate: 0.001
    seq_len: 32
    patch_size: 4
selection_criteria:
  min_trades: 30
  min_sharpe: 1
  max_mdd_pct: 25
  consistency_ratio: 0.6
model_save_dir: models/saved_models
registry_path: models/registry.json
drift_monitoring:
  lookback_bars: 1000
  psi_threshold: 0.25
progress_display:
  enabled: true
  update_interval_sec: 1
  log_to_file: true
  log_file_path: logs/deep_learning_pipeline.log
